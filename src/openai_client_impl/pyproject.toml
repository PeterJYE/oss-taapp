[project]
name = "openai-client-impl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "sqlalchemy>=2",
  "cryptography",
  "python-dotenv",
  "itsdangerous",
]

[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openai_client_impl*"]
