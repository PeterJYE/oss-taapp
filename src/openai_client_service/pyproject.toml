[project]
name = "openai-client-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "authlib",
  "httpx",
  "pydantic>=2",
  "python-dotenv",
  "openai-client-impl",  # comes from your workspace
]

packages = [{ include = "openai_client_service", from = "src" }]
