
[project]
name = "gmail-client-impl"
version = "0.1.0"
description = "Gmail-backed implementation of the mail-client API"
# Match the Python you actually run (you appear to use 3.9.x in the terminal)
requires-python = ">=3.9"
dependencies = [
    "dotenv>=0.9.9",
    "google-api-python-client>=2.177.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2",
    "mail-client-api",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "coverage[toml]>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ----------------------------
# Pytest / Coverage configured to run FROM THIS DIR
# ----------------------------
[tool.pytest.ini_options]
# Make this package and the sibling mail_client_api importable
pythonpath = [
  "src",                      # <- src/gmail_client_impl/src
  "../../mail_client_api/src" # <- sibling package
]
testpaths = ["tests"]
addopts = "-vv --maxfail=1 --disable-warnings --cov=src --cov-report=term-missing"

[tool.coverage.run]
# Collect coverage for this package AND the shared API package
source = [
  "src/gmail_client_impl",
  "../../mail_client_api/src/mail_client_api",
]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

# Linting (inherits repository defaults if you have them)
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = []

# If you're using uv/pdm workspaces:
[tool.uv.sources]
mail-client-api = { workspace = true }
