[project]
name = "ta-assignment"
version = "0.1.0"
description = "Template repository for an OpenAI client"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.30.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "yamllint>=1.35.1",
    "types-requests>=2.32.4.20250611",
]

[tool.uv.workspace]
members = [
  "src/mail_client_api",
  "src/gmail_client_impl",
  "src/mail_client_service",
  "src/openai_service_api",
  "src/openai_client_impl",
  "src/openai_client_service",
  "src/openai_client_service_api_client",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",  # 'incorrect-blank-line-before-class' (D203) and 'no-blank-line-before-class' (D211) are conflicting
  "D213",  # 'multi-line-summary-first-line' (D212) and 'multi-line-summary-second-line' (D213) are conflicting
  "COM812",  # Trailing comma - conflicts with formatter behavior
]
[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
  "S101",
  "ANN401",
  "ARG001",
  "SLF001",  # allow private member access in tests (stubbing/mocking)
  "D102",    # missing method docstrings are fine in test stubs
  "EM101",   # allow simple exception literals in tests
  "PT011",   # broad raises context without match is acceptable in tests
  "PT018",   # combined assertions acceptable in tests
  "ARG002",  # unused args in test doubles
  "TRY003",  # allow inline exception messages in tests
  "I001",    # don't enforce import sorting inside tests (common for importorskip)
]
"src/generated_client/**/*.py" = ["UP007", "F401"]

[tool.mypy]
strict = true
explicit_package_bases = true
# point to the component src/ directories (monorepo)
mypy_path = [
  "src/mail_client_api/src",
  "src/gmail_client_impl/src",
  "src/mail_client_service/src",
  "src/openai_service_api/src",
  "src/openai_client_impl/src",
  "src/openai_client_service/src",
  "src/openai_client_service_api_client/src",
  "src/openai_adapter/src",
  "src/ai_adapter/src",
  "src/generated_client",
  "src/adapter",
  "src/message/src",
]
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "openai_service_api.*",
    "openai_client_impl.*",
    "openai_client_service.*",
    "openai_client_service_api_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__main__.py",
  "src/generated_client/*",
  "src/generated_client/**",
  "src/openai_client_service_api_client/src/**",
  "src/openai_client_impl/**",
  "src/openai_client_service/**",
  "src/openai_service_api/**",
  "src/adapter/**",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

