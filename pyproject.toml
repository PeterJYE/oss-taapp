[project]
name = "ta-assignment"
version = "0.1.0"
description = "Template repository for an OpenAI client"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.30.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "types-requests>=2.32.4.20250611",
]

[tool.uv.workspace]
members = [
  "src/ai_api",
  "src/chat_api",
  "src/chat_api/src/chat_api/chat_service",
  "src/ticket_api",
  "src/ticket_api/src/ticket_api/ticket_impl",
  "src/ticket_api/src/ticket_api/ticket_service",
  "src/mail_client_api",
  "src/gmail_client_impl",
  "src/mail_client_service",
  "src/openai_service_api",
  "src/openai_client_impl",
  "src/openai_client_service",
  "src/openai_client_service_api_client",
  "src/generated_client",
  "src/openai_adapter",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",  # 'incorrect-blank-line-before-class' (D203) and 'no-blank-line-before-class' (D211) are conflicting
  "D213",  # 'multi-line-summary-first-line' (D212) and 'multi-line-summary-second-line' (D213) are conflicting
  "COM812",  # Trailing comma - conflicts with formatter behavior
  "S101",  # Use of assert detected (allowed in test files)
]
[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["ALL"]
"**/tests/**/*.py" = ["ALL"]
"src/chat_api/**/tests/**/*.py" = ["ALL"]
"src/chat_api/**/test_*.py" = ["ALL"]
"src/chat_api/src/chat_api/chat_adapter/tests/**/*.py" = ["ALL"]
"src/generated_client/**/*.py" = ["ALL"]
# Exclude existing team code in chat_api and ticket_api that wasn't checked before integration
"src/chat_api/src/chat_api/chat_adapter/src/**/*.py" = ["ALL"]
"src/chat_api/src/chat_api/chat_impl/**/*.py" = ["ALL"]
"src/chat_api/src/chat_api/chat_service/**/*.py" = ["ALL"]
"src/ticket_api/src/ticket_api/ticket_impl/**/*.py" = ["ALL"]
"src/ticket_api/src/ticket_api/ticket_service/**/*.py" = ["ALL"]

[tool.mypy]
strict = true
explicit_package_bases = false
namespace_packages = true
mypy_path = ["src"]
exclude = "(^|/)tests(/|$)|setup\\.py$|src/ticket_api/src/|src/chat_api/src/"
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "openai_client_impl.*",
    "openai_client_service.*",
    "openai_client_service_api_client.*",
    "openai_service_api.*",
    "gmail_client_impl.*",
    "gmail_client_impl.src.*",
    "mail_client_api.*",
    "slack_api.*",
    "slack_sdk.*",
    "chat_api.chat_adapter.src.slack_adapter.*",
    "chat_api.chat_service.*",
    "chat_api.chat_impl.*",
    "chat_api.chat_adapter.src.*",
    "ticket_api.ticket_impl.src.*",
    "ticket_api.ticket_service.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["generated_client.*", "mail_client_service_client.*", "ticket_api.*", "chat_api.*", "gmail_client_impl.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/*/tests", "src/ticket_api/src/ticket_api/ticket_impl/tests", "src/chat_api/src/chat_api/chat_adapter/tests/test_adapter_final_coverage.py"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
norecursedirs = ["src/chat_api"]
asyncio_mode = "auto"
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__main__.py",
  "src/generated_client/*",
  "src/generated_client/**",
  "src/openai_client_service_api_client/src/**",
  "src/mail_client_api/__init__.py",
  "src/mail_client_service/main.py",
  "src/openai_client_service/__init__.py",
  "src/openai_client_service/main.py",
  "src/openai_client_service/routes/__init__.py",
  "src/mail_client_api/client.py",
  "src/mail_client_api/message.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

