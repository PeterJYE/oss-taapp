[project]
name = "ta-assignment"
version = "0.1.0"
description = "Template repository for an OpenAI client"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.30.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "types-requests>=2.32.4.20250611",
]

[tool.uv.workspace]
members = [
  "src/mail_client_api",
  "src/gmail_client_impl",
  "src/mail_client_service",
  "src/openai_service_api",
  "src/openai_client_impl",
  "src/openai_client_service",
  "src/openai_client_service_api_client",
  "src/generated_client",
  "src/openai_adapter",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",  # 'incorrect-blank-line-before-class' (D203) and 'no-blank-line-before-class' (D211) are conflicting
  "D213",  # 'multi-line-summary-first-line' (D212) and 'multi-line-summary-second-line' (D213) are conflicting
  "COM812",  # Trailing comma - conflicts with formatter behavior
]
[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "ANN401", "ARG001"]
"src/generated_client/**/*.py" = ["UP007", "F401"]

[tool.mypy]
strict = true
explicit_package_bases = false
namespace_packages = true
mypy_path = ["src"]
exclude = "(^|/)tests(/|$)"
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "openai_client_impl.*",
    "openai_client_service.*",
    "openai_client_service_api_client.*",
    "gmail_client_impl.*",
    "mail_client_api.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["generated_client.*","mail_client_service_client.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__main__.py",
  "src/generated_client/*",
  "src/generated_client/**",
  "src/openai_client_service_api_client/src/**",
  "src/mail_client_api/__init__.py",
  "src/mail_client_service/main.py",
  "src/openai_client_service/__init__.py",
  "src/openai_client_service/main.py",
  "src/openai_client_service/routes/__init__.py",
  "src/mail_client_api/client.py",
  "src/mail_client_api/message.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

