[project]
name = "ta-assignment"
version = "0.1.0"
description = "Template repository for an OpenAI client"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=25.3.0",
    "fastapi",
    "uvicorn",
    "openai>=1.40.0",
    "authlib",
    "python-dotenv",
    "sqlalchemy>=2",
    "alembic",
    "cryptography",
    "itsdangerous",
    "httpx",
    "pydantic>=2",
    "pytest-cov>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.30.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "mypy>=1.17.0",
    "pymdown-extensions>=10.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "types-requests>=2.32.4.20250611",
]

[tool.uv.workspace]
members = [
  "src/openai_client_interface",
  "src/openai_client_impl",
  "src/openai_client_service",
  "src/openai_client_service_api_client",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "S101",
]
per-file-ignores = { "**/test_*.py" = ["TRY300", "BLE001", "ANN401", "SLF001", "E501", "S105", "ARG001", "ARG002", "S106", "INP001", "PLC0415"] }

[tool.mypy]
strict = true
explicit_package_bases = true
# point to the component src/ directories (monorepo)
mypy_path = [
  "src/openai_client_interface/src",
  "src/openai_client_impl/src",
  "src/openai_client_service/src",
  "src/openai_client_service_api_client/src",
]
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "openai_client_interface.*",
    "openai_client_impl.*",
    "openai_client_service.*",
    "openai_client_service_api_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__main__.py", "src/generated_client/*", "src/generated_client/**", "src/openai_client_service_api_client/src/**"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
