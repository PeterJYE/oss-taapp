site_name: OSS TA App
site_description: "Integrated Chat-AI-Ticket System - Multi-service application integrating Chat (Slack), AI (OpenAI), and Ticket (JIRA) using shared interfaces."

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - 'Overview': 'index.md'
  - 'Architecture': 'component.md'
  - 'API Reference':
    - 'Mail Client API': 'api/mail_client_api.md'
    - 'Gmail Client Implementation': 'api/gmail_client_impl.md'
  - 'Development':
    - 'Testing': 'testing.md'
    - 'CircleCI Setup': 'circleci-setup.md'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            # This helps mkdocstrings find packages in the src directory
            search_paths: 
              - src
              - src/mail_client_api/src
              - src/gmail_client_impl/src
              - src/ai_api/src
              - src/chat_api/src/chat_api
              - src/ticket_api/src/ticket_api
              - src/openai_client_service/src
              - src/openai_client_impl/src
              - src/openai_adapter/src
              - src/openai_service_api/src
            show_source: false
            docstring_section_style: spacy
            members_order: source
